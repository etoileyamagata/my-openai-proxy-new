[build]
  command = "npm ci --no-audit --no-fund && node scripts/build-ebay.cjs"
  publish = "dist-ebay"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "fast-xml-parser"]

[[redirects]]
  from = "/"
  to = "/ebay/"
  status = 302

[[headers]]
  for = "/ebay/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
