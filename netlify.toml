[build]
  command = "npm ci --omit=dev --no-audit --no-fund && node scripts/build-ebay.cjs"
  publish = "dist-ebay"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  # V2 functions use NFT tracing. Local CommonJS imports become __require
  # calls that NFT can miss, so include the production dependencies explicitly.
  included_files = ["node_modules/**"]

[[redirects]]
  from = "/"
  to = "/ebay/"
  status = 302

[[headers]]
  for = "/ebay/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
